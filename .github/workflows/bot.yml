name: Run Telegram Bot

on:
  schedule:
    - cron: "0 * * * *"  # pokreće se na početku svakog sata
  workflow_dispatch:      # omogućava ručno pokretanje

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔧 Popravljeno kreiranje JSON fajla
      - name: Create service account file
        run: echo "${GOOGLE_SERVICE_JSON}" > service-account.json
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}

      # 🧪 Debug i pokretanje
      - name: Run bot with debug info
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          echo "=== START BOT ==="
          echo "TELEGRAM_TOKEN: $([ -n \"$TELEGRAM_TOKEN\" ] && echo OK || echo MISSING)"
          echo "CHAT_ID: $([ -n \"$CHAT_ID\" ] && echo OK || echo MISSING)"
          echo "SHEET_ID: $([ -n \"$SHEET_ID\" ] && echo OK || echo MISSING)"
          echo "service-account.json postoji? $(test -f service-account.json && echo YES || echo NO)"
          echo "Pokrećem Python skriptu..."
          python oglasi_bot.py
          echo "=== END BOT ==="
